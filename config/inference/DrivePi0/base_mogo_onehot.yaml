defaults:
  - _self_
hydra:
  run:
    dir: ${log_dir}
_target_: src.agent.drivepi0.eval.DrivePiZeroEvalAgent

current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Drive_pi  # You need to set path
log_dir: ${oc.env:LOG_DIR}/eval/${name}/${now:%Y-%m-%d}_${now:%H-%M}_${seed}
name: drive-pi0
device: cuda
gpu_id: 0
n_nodes: 1
seed: 42
action_expert_adaptive_mode:  # adaLN, adaLN-Zero, or None
quantize: False
lora: False
lora_r: 32
lora_dropout: 0.0
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct  # You need to set path
checkpoint_path:   # 需要填入 onehot 训练的 checkpoint 路径
# 归一化方法: percentile_clip, percentile, minmax
norm_mode: minmax

data:
  statistics_path: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi/statistics.json
  use_fixed_images: False
  work_dir: ${current_dir}
  split: val
  num_of_action_experts: 13 # useless in drive-pi0
  shuffle_buffer_size: 200000
  norm_mode: ${norm_mode}
  nav_onehot: True  # 启用 navigation_id one-hot 编码


eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
device_batch_size: 32

num_workers: 6
flow_sampling: beta
num_inference_steps: 20  # 增大推理去噪步数 (从 10 增到 20)
final_action_clip_value: 1.0  # data normalized in [-1,1]
debug: False
# 保存轨迹数据（用于后续可视化）
save_trajectories: True
# 需要修改的参数：cond_steps, horizon_steps
cond_steps: 5
horizon_steps: 7

action_dim: 2 # EEF_POS
proprio_dim: 13  # his_speed(1) + his_acceleration(3) + his_angular_velocity(3) + his_theta(1) + navigation_id_onehot(5) = 13
state_dim: ${proprio_dim}
# 参数更改
max_seq_len: 600
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

mixture:
  vlm:   # qwen3-vl
    hidden_size: 2048
    intermediate_size: 6144
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
time_hidden_size: 256

# Fixed
pad_token_id: 0

joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: "gelu_pytorch_tanh"
    max_position_embeddings: 262144
    rms_norm_eps: 1e-6
    rope_theta: 5000000
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    rope_scaling:
      mrope_interleaved: true
      mrope_section: [24, 20, 20]
      rope_type: "default"

# 修改 token 相关配置
image_token_index: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653
vocab_size: 151936
bos_token_id: 151643
eos_token_id: 151645
