joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28  # 修改为 28（Qwen3-VL-2B 的层数）
    num_attention_heads: 16  # Qwen3-VL-2B 的 attention heads（官方值）
    num_key_value_heads: 8  # Qwen3-VL-2B 的 KV heads（官方值）
    head_dim: 128  # Qwen3-VL-2B 的 head_dim（官方值）
    hidden_act: "gelu_pytorch_tanh"  # 官方值
    max_position_embeddings: 262144  # Qwen3-VL-2B 的 max position embeddings（官方值）
    rms_norm_eps: 1e-6
    rope_theta: 5000000  # Qwen3-VL-2B 的 rope_theta（官方值）
    attention_bias: False  # Qwen3-VL-2B 不使用 bias（官方值）
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    # RoPE配置（官方）
    rope_scaling:
      mrope_interleaved: true  # Interleaved-MRoPE（官方值）
      mrope_section: [24, 20, 20]  # 官方值
      rope_type: "default"

# 修改 token 相关配置
image_token_index: 151655  # Qwen3-VL-2B 的图像 token ID（官方值）
video_token_id: 151656  # Qwen3-VL-2B 的视频 token ID（官方值）
vision_start_token_id: 151652  # Qwen3-VL-2B 的视觉开始token ID（官方值）
vision_end_token_id: 151653  # Qwen3-VL-2B 的视觉结束token ID（官方值）
vocab_size: 151936  # Qwen3-VL-2B 的 vocab size（官方值）
bos_token_id: 151643  # Qwen3-VL-2B 的 bos token ID（官方值）
eos_token_id: 151645  # Qwen3-VL-2B 的 eos token ID（官方值）