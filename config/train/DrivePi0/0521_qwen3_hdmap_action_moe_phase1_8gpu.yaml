# ============================================================================
# Phase 1: Action Expert MOE 配置 (0521 修订版，基于 0520)
# ============================================================================
# 配置说明:
#   - 在 0520 配置基础上修订 routed expert 初始化与路由梯度行为，对应代码侧
#     src/model/DrivePi0/moe_mlp.py 的两处修正：
#       (1) top_k=1 时不再对 topk_probs 做 /sum 归一化，让 router gate 收到
#           主 loss 的任务梯度 (此前 weight 恒为 1，gate 只被 load-balance
#           loss 训练，容易学成均匀分流)。
#       (2) init_routed_from_shared 末尾把 routed expert 的 down_proj.weight
#           置零，使训练第 0 步 routed(x) ≡ 0 → out = shared(x)，严格保留
#           0514 baseline，避免 14 层残差流叠加 (1+1/N) 倍漂移。
#   - 仅替换 Action/Proprio mixture 的 MLP 为 SharedExpertMoEMLP (1 shared +
#     N routed top-1)。VLM 路径保持不变 (Image Expert MoE 留给 Phase 2)。
#   - 设计与代码对齐说明见 docs/moe_design_v2_适配方案.md。
#
# 与 0520 配置的关键差异:
#   - moe.routed_init_noise_std: 0.01 → 1e-3
#     down_proj 被强制置零后，noise 只承担「打破 N 个 routed expert 之间的
#     对称性」的职责。Qwen3MLP 线性层权重 std ≈ 1/√fan_in ≈ 0.02–0.03，
#     1e-3 已经是 ~3% 的相对扰动，足够破对称；过大反而让 expert 中间特征
#     差距过早拉开，影响早期路由稳定性。
#   - run_name 后缀加 _v2 标记本修订版。
#
# 三种加载模式:
#   1. 首训 MoE (load_pretrained_weights=True, finetune/resume=null):
#      action MLP 随机初始化 → shared_expert 随机；routed_expert 从 shared
#      拷贝 + 噪声 (gate/up_proj)，down_proj 置零。
#      不推荐——会浪费 0514 baseline 的训练成果。
#   2. Finetune 升级 (本配置默认): load_pretrained_weights=True,
#      finetune_checkpoint_path 指向 0514 step37400；shared_expert 从 ckpt
#      重映射加载，routed_expert 拷贝 shared + 噪声 (gate/up_proj)，
#      down_proj 置零 → 第 0 步严格等价 0514 baseline。
#   3. 断点续训 (resume_checkpoint_path=/path/to/moe_ckpt.pt): 完整恢复 MoE
#      状态，不再经过 init_routed_from_shared。
# ============================================================================

defaults:
  - _self_

hydra:
  run:
    dir: ${log_dir}

_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

# ==================== 路径配置 ====================
current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/DrivePi_8GPU
dataset_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi_hdmap
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_qwen3_hdmap_action_moe_phase1_v2_8gpu
log_dir: ${oc.env:LOG_DIR,logs}/train/${name}/${run_name}

# ==================== 基本设置 ====================
name: drive-pi0
device: cuda
n_nodes: 1
seed: 42

# ==================== 模型加载 ====================
# 推荐使用 finetune 模式：从 0514 step37400 出发做 MoE 升级，shared_expert 自动重映射。
# 如需首训 MoE，把 finetune_checkpoint_path 置 null 即可。
load_pretrained_weights: True
resume_checkpoint_path:
finetune_checkpoint_path: ${current_dir}/logs/train/drive-pi0/2026-05-14_20-56_qwen3_hdmap_all_features_8gpu/checkpoint/step37400.pt

# ==================== 训练模式 ====================
train_vlm: True                    # 与 0514 baseline 保持一致
state_only_for_action: False
mask_vlm_for_action: False
action_expert_adaptive_mode:        # adaLN / adaLN-Zero / null
use_torch_compile: False            # MoE 初版关闭 torch.compile，避免稀疏路由分支产生 graph break
use_bf16: True
use_fp16: False
use_amp: True
quantize: False
use_lm_head: False

# ==================== LoRA 配置 ====================
# 与 0514 一致，全部关闭。如未来需要在 routed_expert 上加 LoRA，请同步修改
# src/model/DrivePi0/mixture.py 中 SharedExpertMoEMLP 的 mlp_kwargs.use_lora。
lora: False
lora_r: 32
lora_alpha: 32
lora_dropout: 0.05
lora_vlm: False
lora_vlm_target_modules: [q_proj, k_proj, v_proj, o_proj]
lora_vlm_mlp: False
lora_vision: False
lora_vision_mlp: False
lora_vision_merger: False
lora_vision_deepstack_merger: False

# ==================== HDMap 开关 (A/B/C1-C3) ====================
use_hdmap_image: True
hdmap_image_size: [352, 192]
use_hdmap_proprio: False
use_hdmap_cnn: False
hdmap_cnn_dim: 32
hdmap_bev_downsample_size: [96, 180]
hdmap_downsample_mode:
  lanes: max
  lane_links: max
  lane_boundaries: max
  junctions: area
hdmap_channel_scale: [0.08, 0.12, 0.10, 1.0]
hdmap_fusion_mode: gated_residual

separate_hdmap_optimizer_group: False
hdmap_lr: 1e-4
hdmap_weight_decay: 1e-4
hdmap_lr_scheduler:
  min_lr: 1e-6

# ==================== 数据集 ====================
data:
  train:
    statistics_path: ${dataset_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: ${dataset_dir}
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: False
    use_his_trajectory: True
    state_frame_index:
    cam_image_size: ${cam_image_size}
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_image_size: ${hdmap_image_size}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}
  val:
    statistics_path: ${dataset_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: ${dataset_dir}
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: False
    use_his_trajectory: True
    state_frame_index:
    cam_image_size: ${cam_image_size}
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_image_size: ${hdmap_image_size}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}

cam_image_size: [224, 224]
norm_mode: minmax

# ==================== 日志 ====================
swanlab:
  enable: False
  project: DriveMoE_Qwen3
  experiment_name: ${run_name}
  mode: cloud
  description: "Qwen3-VL + HDMap A + Action MoE Phase1 (1 shared + 3 routed top-1)"
  entity: null

log_freq: 16

# ==================== 加权采样 (方案 D) ====================
nav_weighted_sampling: False
trajectory_weighted_sampling:
  enable: True
  static_threshold: 1.0
  turn_threshold: 2.0
  static_weight: 2.0
  turn_weight: 3.0
  straight_weight: 1.0
  hard_case_weight_path: null
  hard_case_alpha: 1.0

# ==================== 训练超参数 ====================
n_epochs: 20                        # MoE 升级训练，相对 baseline 缩短一半 epoch
n_train: 59778
num_gpus: 8
per_device_batch_size: 6            # 显存预留 routed expert 3×37.7M/层；A100-80GB 安全值 8
global_batch_size: ${eval:'${per_device_batch_size} * ${num_gpus}'}
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}
save_model_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
num_workers: 8
max_grad_norm: 1.0

# ==================== Eval 配置 ====================
eval_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
eval_size: 1024
eval_full_val: True
eval_seed: 42
eval_repeats: 1
eval_map_modes: [normal]
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]

# ==================== 学习率 (方案 H) ====================
# - action_lr / vlm_lr 与 0514 一致；
# - moe.router_lr / moe.routed_expert_lr 见下方 moe 段。
action_lr: 5e-5
vlm_lr: 5e-6
action_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 200
vlm_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 500
action_weight_decay: 0
vlm_weight_decay: 0

# ==================== Flow Matching ====================
flow_sampling: beta
flow_alpha: 1.5
flow_beta: 1.0
flow_sig_min: 0.001
num_inference_steps: 10
final_action_clip_value: 1.0

# ==================== 轨迹辅助损失 ====================
trajectory_loss:
  lambda_smooth: 0.05
  lambda_accel: 0.02
  endpoint_weight_mode: linear
  endpoint_weight_max: 2.0

# ==================== Action-grounded 辅助监督 (方案 A) ====================
aux_loss:
  enable: False
  lambda_maneuver: 0.2
  lambda_stop: 0.1
  lambda_endpoint: 0.2
  lambda_progress: 0.05
  lambda_curvature: 0.05

# ==================== 序列维度 ====================
cond_steps: 5
horizon_steps: 6
action_dim: 2
proprio_dim: 9
state_dim: ${proprio_dim}

max_seq_len: 700
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

# ==================== Mixture 配置 ====================
mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 6144
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}

time_hidden_size: 256

# ==================== Joint Model (Transformer) ====================
joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: ${pretrained_model_path}
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: "silu"
    max_position_embeddings: 262144
    rms_norm_eps: 1e-6
    rope_theta: 5000000
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    rope_scaling:
      mrope_interleaved: true
      mrope_section: [24, 20, 20]
      rope_type: "default"

# ==================== Qwen3-VL Token 配置 ====================
pad_token_id: 0
image_token_index: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653
vocab_size: 151936
bos_token_id: 151643
eos_token_id: 151645

# ============================================================================
# MOE v2: Shared Expert + Routed Expert（Phase 1 仅启用 Action Expert）
# ============================================================================
#
# 实现位置:
#   - src/model/DrivePi0/moe_mlp.py        — SharedExpertMoEMLP 类（含 aux_loss）
#   - src/model/DrivePi0/mixture.py        — MixtureDecoderLayer 根据本配置切换 MLP
#   - src/model/DrivePi0/drivepi0.py       — forward 末尾汇总 aux_loss；参数分组
#   - src/agent/drivepi0/train.py          — 独立 moe_optimizer + lr_scheduler
#
# 关键决策:
#   1. action_expert.enable = True：仅替换 Action/Proprio mixture 的 MLP；VLM 路径不动。
#   2. image_expert.enable = False：Phase 2 才打开；保留字段方便切换。
#   3. freeze_shared_expert = True：保护 0514 baseline 已训练的 action MLP 权重，
#      让 routed_expert 在其周围学习 specialization；如需放开做 joint finetune，
#      改成 False，shared_expert 会跟随 action_optimizer 用 action_lr 训练。
#   4. routed_init_noise_std = 1e-3：down_proj 被零初始化后，routed(x) 在 step 0
#      严格等于 0，noise 只用于打破 N 个 routed expert 之间的对称性 (避免它们
#      共同沿相同梯度方向演化)。Qwen3MLP 线性层 std ≈ 0.02–0.03，1e-3 是 ~3%
#      的相对扰动，足够破对称；0.01 量级反而会让 expert 中间特征差距过早拉开。
#   5. aux_loss_coeff = 1.0：与 SharedExpertMoEMLP 模块内 load_balance_coeff=0.01
#      串联。总 aux loss = 1.0 × sum_layer(0.01 × N_e × sum_i(f_i·P_i))，相对
#      flow matching loss (~1e-2 → 1e-1) 数量级合适。
#   6. router_lr = 1e-4：略高于 action_lr=5e-5，让 router 优先收敛到合理分配。
#      由于 top_k=1 时已修复 router 的主 loss 梯度路径，router 不再仅依赖
#      load-balance loss 训练，本 lr 配合 warmup 即可。
# ============================================================================
moe:
  # ── 总开关 ─────────────────────────────────────────────────────────────────
  aux_loss_coeff: 1.0               # forward 累加 aux_loss 时的总倍率
  freeze_shared_expert: True        # True=保护 baseline 权重；False=与 action 共训
  routed_init_noise_std: 1e-3       # 仅作用于 routed expert 的 gate_proj/up_proj；
                                    # down_proj 由代码侧强制置零，不受此值影响

  # ── 学习率（routed_expert 默认与 action_lr 一致） ─────────────────────────
  router_lr: 1e-4
  routed_expert_lr: ${action_lr}
  router_weight_decay: 0.0
  routed_expert_weight_decay: ${action_weight_decay}
  lr_scheduler:
    router_min_lr: 1e-6
    routed_expert_min_lr: ${action_lr_scheduler.min_lr}

  # ── Action Expert MOE（Phase 1 启用） ─────────────────────────────────────
  action_expert:
    enable: True
    num_routed_experts: 3           # 决策空间 C(3,1)=3，负载均衡容易
    top_k: 1                        # 每 token 激活 1 个 routed + 1 个 shared = 2 个 expert
    load_balance_coeff: 0.01        # 单层负载均衡 loss 系数

  # ── Image Expert MOE（Phase 2 才打开） ────────────────────────────────────
  image_expert:
    enable: False
    num_routed_experts: 3
    top_k: 1
    apply_to_layers: even_mid       # even / even_mid (14-26) / all
    load_balance_coeff: 0.01
