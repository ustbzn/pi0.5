defaults:
  - _self_
hydra:
  run:
    dir: ${log_dir}
_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/DrivePi_mogo  # You need to set path
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_mogo_onehot_navi
log_dir: ${oc.env:LOG_DIR}/train/${name}/${run_name}

name: drive-pi0
device: cuda
n_nodes: 1
seed: 42
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct   # You need to set path
load_pretrained_weights: True

# 模式 3: 在 navi 版本的 checkpoint 基础上微调（全新优化器+学习率）
resume_checkpoint_path:
finetune_checkpoint_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Drive_pi/logs/train/drive-pi0/2026-04-07_17-14_mogo_0407_4img_navi/checkpoint/step2080.pt

train_vlm: False  # 是否训练 VLM 模块；如果 False，VLM 模块权重冻结不更新
action_expert_adaptive_mode:  # adaLN, adaLN-Zero, or None
use_torch_compile: True
use_bf16: True
# 混合精度
use_amp: True
quantize: False
lora: False
lora_r: 32
lora_dropout: 0.05

# ===== 方案B: one-hot 编码 + 方案D: 加权采样 =====
# navigation_id 使用 one-hot 编码 (5维) 替代 minmax 标量 (1维)
nav_weighted_sampling: True  # 启用加权采样，平衡导航指令类别分布

data:
  train:
    statistics_path: ${data.train.dynamic_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13 # useless in drive-pi0
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: True  # 启用 navigation_id one-hot 编码
  val:
    statistics_path: ${data.val.dynamic_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13 # useless in drive-pi0
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: True  # 启用 navigation_id one-hot 编码

swanlab:
  enable: True
  project: DriveMoE_Qwen3
  experiment_name: ${run_name}
  mode: cloud
  description: null
  entity: null

log_freq: 16
n_epochs: 40
# 归一化方法: percentile_clip, percentile, minmax
norm_mode: minmax
# 需要修改的参数
n_train: 52620  # total training samples; update when dataset size changes
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}
save_model_freq: ${eval:'(${n_train} + ${global_batch_size} - 1) // ${global_batch_size}'}
eval_freq: 1000
eval_size: 1024
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]

# 4 GPU 训练参数
# 实际 global_batch_size = per_device_batch_size * grad_accumulation_steps * num_gpus
# 4 GPU * 80 per_device * 3 accumulation = 960 (接近 1024)
global_batch_size: 1024
per_device_batch_size: 80
num_workers: 8
# 学习率
action_lr: 5e-6  # 降低学习率 (从 1e-5 降到 5e-6)，因为是在已有 checkpoint 上 finetune
vlm_lr: 1e-5
action_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 500  # 增加 warmup (从 200 增到 500)
vlm_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 500
action_weight_decay: 0
vlm_weight_decay: 0
# 梯度裁剪
max_grad_norm: 1.0

flow_sampling: beta
num_inference_steps: 20  # 增大推理去噪步数 (从 10 增到 20)
final_action_clip_value: 1.0  # data normalized in [-1,1]

cond_steps: 5  # 必须与 window.sh 中的 --window_size 参数一致
horizon_steps: 7  # 必须与 window.sh 中的 --horizon 参数一致
action_dim: 2 # EEF_POS
proprio_dim: 13  # his_speed(1) + his_acceleration(3) + his_angular_velocity(3) + his_theta(1) + navigation_id_onehot(5) = 13
state_dim: ${proprio_dim}
max_seq_len: 600
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

mixture:
  vlm:   # qwen3-vl
    hidden_size: 2048
    intermediate_size: 6144
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
time_hidden_size: 256

# Fixed
pad_token_id: 0

joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: "gelu_pytorch_tanh"
    max_position_embeddings: 262144
    rms_norm_eps: 1e-6
    rope_theta: 5000000
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    rope_scaling:
      mrope_interleaved: true
      mrope_section: [24, 20, 20]
      rope_type: "default"

# 修改 token 相关配置
image_token_index: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653
vocab_size: 151936
bos_token_id: 151643
eos_token_id: 151645
