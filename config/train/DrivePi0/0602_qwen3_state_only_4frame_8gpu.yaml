# ============================================================================
# 消融实验：严格 state-only（纯 ego state → action，不走任何视觉/语言路径）
# ============================================================================
# 配置说明:
#   - 由 0601_qwen3_video_5frame_vlm_8gpu.yaml 派生，关闭视觉，仅保留 ego state。
#   - state_only_for_action=True 时，代码 (drivepi0.py / train.py) 会:
#       * 跳过 Qwen3VLProcessor / tokenizer 初始化，不加载任何相机图像;
#       * joint_model 只前向 proprio + action 两路 mixture，VLM 完全不参与;
#     因此 video / 8 图 / HDMap 图像类开关在本配置下全部无意义，必须关闭。
#   - 目的: 测量"仅凭当前帧自车状态能把未来 6 步轨迹预测多准"，作为视觉/地图增益的下界基线。
#   - 关键修正 (相对 0527/0429 旧 state_only): state_frame_index 由 0 改为 4。
#       his_speed/acceleration/angular_velocity/theta 在 pkl 中按 [t-2.0s .. 当前帧] 升序排列
#       (state_history_window=5)，index=4 才是当前帧 (his_theta[4]=0)，index=0 是 2 秒前最早历史帧。
#       旧配置 state_frame_index=0 喂的是滞后 2 秒的状态，会系统性低估 state-only 基线，故此处取 4。
#   - Token 预算: state-only 不构建图文序列，仅 proprio(1)+action(6)；max_seq_len 仅占位用，设 64 足够。
# ============================================================================

defaults:
  - _self_

hydra:
  run:
    dir: ${log_dir}

_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

# ==================== 路径配置 ====================
current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/DrivePi_8GPU
dataset_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi_hdmap
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_qwen3_state_only_8gpu
log_dir: ${oc.env:LOG_DIR,logs}/train/${name}/${run_name}

# ==================== 基本设置 ====================
name: drive-pi0
device: cuda
n_nodes: 1
seed: 42

# ==================== 模型加载 ====================
# state-only 不依赖 Qwen3-VL 视觉权重，但 joint_model 仍会按 pretrained 路径构建 VLM mixture 结构；
# load_pretrained_weights=True 保持与其它配置一致即可（VLM 权重加载但不参与 state-only 前向）。
load_pretrained_weights: True
resume_checkpoint_path:
finetune_checkpoint_path:

# ==================== 训练模式 ====================
train_vlm: False                    # state-only 下 VLM 不参与前向，强制 False
state_only_for_action: True         # 严格 state-only：跳过 tokenizer/processor，不加载图像
mask_vlm_for_action: False
action_expert_adaptive_mode:
use_torch_compile: True             # 只 compile joint_model/action/proprio，无 vision_tower
use_bf16: True
use_fp16: False
use_amp: True
quantize: False
use_lm_head: False

# ==================== LoRA 配置 (state-only 下全部无效) ====================
lora: False
lora_r: 32
lora_alpha: 32
lora_dropout: 0.05
lora_vlm: False
lora_vlm_target_modules: [q_proj, k_proj, v_proj, o_proj]
lora_vlm_mlp: False
lora_vision: False
lora_vision_mlp: False
lora_vision_merger: False
lora_vision_deepstack_merger: False

# ==================== HDMap 开关 (state-only 下全部关闭) ====================
use_hdmap_image: False
hdmap_image_size: [352, 192]
use_hdmap_proprio: False
use_hdmap_cnn: False
hdmap_cnn_dim: 32
hdmap_bev_downsample_size: [96, 180]
hdmap_downsample_mode:
  lanes: max
  lane_links: max
  lane_boundaries: max
  junctions: area
hdmap_channel_scale: [0.08, 0.12, 0.10, 1.0]
hdmap_fusion_mode: gated_residual
separate_hdmap_optimizer_group: False
hdmap_lr: 1e-4
hdmap_weight_decay: 1e-4
hdmap_lr_scheduler:
  min_lr: 1e-6

# ==================== Video 时序输入 (state-only 下关闭) ====================
use_video_input: False              # state-only 不加载任何相机帧，必须 False
video_frame_offsets: [4, 3, 2, 1, 0]
video_fps: 2.0
video_frame_interval: 0.5

# ==================== 数据集 ====================
# state-only 只读取 ego state（his_speed/acceleration/angular_velocity/theta/navigation_id），
# 不加载相机帧；video_* 字段虽传入但 use_video_input=False 时 dataset 不会使用。
data:
  train:
    statistics_path: ${dataset_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: ${dataset_dir}
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: False
    use_his_trajectory: False
    use_acceleration: False
    use_angular_velocity: False
    state_frame_index: 4            # 取当前帧（index=4）；旧 state_only 配置误用 0（=2秒前历史帧）
    cam_image_size: ${cam_image_size}
    use_video_input: ${use_video_input}
    video_frame_offsets: ${video_frame_offsets}
    video_fps: ${video_fps}
    video_frame_interval: ${video_frame_interval}
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_image_size: ${hdmap_image_size}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}
  val:
    statistics_path: ${dataset_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: ${dataset_dir}
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: False
    use_his_trajectory: False
    use_acceleration: False
    use_angular_velocity: False
    state_frame_index: 4
    cam_image_size: ${cam_image_size}
    use_video_input: ${use_video_input}
    video_frame_offsets: ${video_frame_offsets}
    video_fps: ${video_fps}
    video_frame_interval: ${video_frame_interval}
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_image_size: ${hdmap_image_size}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}

cam_image_size: [224, 224]          # state-only 不使用，仅占位保持字段完整
norm_mode: minmax

# ==================== 日志 ====================
swanlab:
  enable: False
  project: DriveMoE_Qwen3
  experiment_name: ${run_name}
  mode: cloud
  description: "qwen3 state-only baseline (state_frame_index=4, current frame)"
  entity: null

log_freq: 16

# ==================== 加权采样 ====================
nav_weighted_sampling: False
trajectory_weighted_sampling:
  enable: True
  static_threshold: 1.0
  turn_threshold: 2.0
  static_weight: 2.0
  turn_weight: 3.0
  straight_weight: 1.0
  hard_case_weight_path: null
  hard_case_alpha: 1.0

# ==================== 训练超参数 ====================
n_epochs: 40
n_train: 59778
num_gpus: 8
per_device_batch_size: 80           # state-only 无视觉，显存压力极小，可用大 batch（参考 0527）
global_batch_size: ${eval:'${per_device_batch_size} * ${num_gpus}'}
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}
save_model_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
num_workers: 8
max_grad_norm: 1.0

# ==================== Eval 配置 ====================
eval_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
eval_size: 1024
eval_full_val: True
eval_seed: 42
eval_repeats: 1
eval_map_modes: [normal]
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]

# ==================== 学习率 ====================
# state-only 仅训练 action expert + proprio_encoder；vlm_lr 留着但无对应参数组。
action_lr: 5e-5
vlm_lr: 5e-5
action_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 200
vlm_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 500
action_weight_decay: 0
vlm_weight_decay: 0

# ==================== Flow Matching ====================
flow_sampling: beta
flow_alpha: 1.5
flow_beta: 1.0
flow_sig_min: 0.001
num_inference_steps: 10
final_action_clip_value: 1.0

# ==================== 轨迹辅助损失 ====================
trajectory_loss:
  lambda_smooth: 0.05
  lambda_accel: 0.02
  endpoint_weight_mode: linear
  endpoint_weight_max: 2.0

# ==================== Action-grounded 辅助监督 ====================
aux_loss:
  enable: False
  lambda_maneuver: 0.2
  lambda_stop: 0.1
  lambda_endpoint: 0.2
  lambda_progress: 0.05
  lambda_curvature: 0.05

# ==================== 序列维度 ====================
cond_steps: 1
horizon_steps: 6
action_dim: 2
# proprio_dim 计算:
#   完整 his state = speed(2)+acceleration(2)+angular_velocity(1)+theta(1)+navigation_id(1)=7
#   本配置 data.{train,val} 置 use_acceleration=False + use_angular_velocity=False，
#   去掉 accel(2)+angvel(1) → speed(2)+theta(1)+navigation_id(1)=4。
#   三处必须一致：开关 / 此处 proprio_dim / Normalize.prepare_state 实际拼接维度。
proprio_dim: 4
state_dim: ${proprio_dim}

# state-only 不构建图文序列，max_seq_len 仅占位（实际只有 proprio(1)+action(6)）。
max_seq_len: 64
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

# ==================== Mixture 配置 ====================
mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 6144
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}

time_hidden_size: 256

# ==================== Joint Model (Transformer) ====================
joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: ${pretrained_model_path}
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: "silu"
    max_position_embeddings: 262144
    rms_norm_eps: 1e-6
    rope_theta: 5000000
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    rope_scaling:
      mrope_interleaved: true
      mrope_section: [24, 20, 20]
      rope_type: "default"

# ==================== Qwen3-VL Token 配置 ====================
pad_token_id: 0
image_token_index: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653
vocab_size: 151936
bos_token_id: 151643
eos_token_id: 151645
