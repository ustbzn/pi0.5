# ============================================================================
# 公平对比实验：B2D Action State-Only 模式 (纯 action expert, 不使用 VLM)
# ============================================================================
# 配置说明:
#   - state_only_for_action: True → 跳过所有图像加载和 VLM 前向
#   - 数据集: /pcpt/pcpt/data/VLA/MOGO/b2d_action
#   - pkl 格式: his_speed(5), his_acceleration(5,3), his_angular_velocity(5,3),
#              his_theta(5), x/y_command_far(5), fur_x/fur_y(1,20)
#   - horizon_steps: 20 → 对齐新 B2D action 数据集 20 个未来轨迹点
#   - max_seq_len / num_image_tokens 与 frozen VLM 保持一致，便于公平对比
# ============================================================================

hydra:
  run:
    dir: ${log_dir}

# 训练入口类
_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

# ==================== 路径配置 ====================
current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Drive_pi
dataset_dir: /pcpt/pcpt/data/VLA/MOGO/b2d_action_hisTraj
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_fair_b2d_state_only_action_front_history_histraj
log_dir: ${oc.env:LOG_DIR}/train/${name}/${run_name}

# ==================== 基本设置 ====================
name: drive-pi0
device: cuda
n_nodes: 1
seed: 42
pretrained_model_path: /D2/NXT/vlm/miaobinqi/models/paligemma-3b-pt-224

# ==================== 模型加载 ====================
load_pretrained_weights: True
resume_checkpoint_path:
finetune_checkpoint_path:

# ==================== 训练模式 ====================
train_vlm: False                    # ★ VLM 完全冻结
action_expert_adaptive_mode:        # 不使用 adaLN
use_torch_compile: True             # 编译加速
use_bf16: True
use_amp: True
quantize: False

# ==================== LoRA (不使用) ====================
lora: False
lora_r: 32
lora_dropout: 0.05
lora_vlm: ${lora}
lora_vlm_mlp: False
lora_vision: False
lora_projector: False

# ==================== 核心开关 ====================
state_only_for_action: True        # ★ ★ 纯 action, 不使用 VLM 图像
mask_vlm_for_action: False
camera_mode: b2d_front_history_2    # 前向当前帧 + 前向上一帧图像

# ==================== 数据集 ====================
data:
  train:
    statistics_path: ${dataset_dir}/b2d_statistics.json
    use_fixed_images: False
    work_dir: ${dataset_dir}
    dynamic_dir: .
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    use_his_trajectory: True
    state_frame_index:
    nav_onehot: False
    state_only: ${state_only_for_action}  # False → 加载图片
    image_augment: True
    camera_mode: ${camera_mode}
  val:
    statistics_path: ${dataset_dir}/b2d_statistics.json
    use_fixed_images: False
    work_dir: ${dataset_dir}
    dynamic_dir: .
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    use_his_trajectory: True
    state_frame_index:
    nav_onehot: False
    state_only: ${state_only_for_action}
    image_augment: False
    camera_mode: ${camera_mode}

# ==================== SwanLab 日志 ====================
swanlab:
  enable: False
  project: drive-pi0
  experiment_name: ${run_name}
  mode: cloud
  description: "B2D action, front current+previous images, his_x/his_y state, 20-point trajectory"
  entity: null

log_freq: 16
norm_mode: percentile               # 新 B2D action 统计文件提供分位数

# ==================== 训练超参数 (与 state_only 完全一致) ====================
n_epochs: 15
n_train: 215672
per_device_batch_size: 16           # ★ 与 state_only 相同
num_gpus: 8
global_batch_size: 1024
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}
save_model_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
eval_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
eval_size: 12000                    # 覆盖全部 val 样本 (11808)
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
num_workers: 8

# ==================== 学习率 ====================
action_lr: 5e-5
vlm_lr: 5e-5
action_lr_scheduler:
  first_cycle_steps: ${n_updates}   # cosine 不衰减
  min_lr: 1e-8
  warmup_steps: 200
vlm_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 200
action_weight_decay: 0
vlm_weight_decay: 0
max_grad_norm: 1.0                  # 梯度裁剪

# ==================== Flow Matching ====================
flow_sampling: beta
num_inference_steps: 10
final_action_clip_value: 1.0        # 归一化空间 [-1, 1]

# ==================== 序列维度 ====================
cond_steps: 5                       # B2D action 历史状态帧数
horizon_steps: 20                   # B2D action 未来轨迹点数
action_dim: 2                       # (x, y)
proprio_dim: 12                     # speed(1)+accel(3)+angular_vel(3)+theta(1)+far_cmd(2)+his_x/his_y(2)
state_dim: ${proprio_dim}
max_seq_len: 600                    # 2×256 patches + cam_labels + text + 余量
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

# ==================== 加权采样 (关闭) ====================
nav_weighted_sampling: False
trajectory_weighted_sampling:
  enable: False
  static_threshold: 1.0
  turn_threshold: 2.0
  static_weight: 2.0
  turn_weight: 3.0
  straight_weight: 1.0
  hard_case_weight_path: null
  hard_case_alpha: 1.0

# ==================== 轨迹辅助损失 ====================
trajectory_loss:
  lambda_smooth: 0.0
  lambda_accel: 0.0
  endpoint_weight_mode: none
  endpoint_weight_max: 2.0

# ==================== 辅助监督 (关闭) ====================
aux_loss:
  enable: False
  lambda_maneuver: 0.2
  lambda_stop: 0.1
  lambda_endpoint: 0.2
  lambda_progress: 0.05
  lambda_curvature: 0.05

# ==================== Mixture 配置 ====================
mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 16384
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
time_hidden_size: 256

# ==================== Tokenizer ====================
image_token_index: 257152
vocab_size: 257216
pad_token_id: 0

# ==================== Vision (SigLIP) ====================
vision:
  _target_: src.model.paligemma.siglip.SiglipVisionModel
  config:
    hidden_size: 1152
    intermediate_size: 4304
    num_hidden_layers: 27
    num_attention_heads: 16
    num_channels: 3
    image_size: 224
    patch_size: 14                  # (224/14)^2 = 256 patches/image
    layer_norm_eps: 1e-6
    attention_dropout: 0.0
    num_image_tokens: 512           # 2 images × 256 patches
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
  use_quantize: ${quantize}
  use_lora: ${lora}

# ==================== Vision Projector ====================
vision_projector:
  _target_: src.model.paligemma.siglip.PaliGemmaMultiModalProjector
  config:
    vision_config:
      hidden_size: 1152
      projection_dim: 2048
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
  use_quantize: ${quantize}
  use_lora: ${lora}

# ==================== Joint Model (Transformer) ====================
joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 18
    num_attention_heads: 8
    num_key_value_heads: 1
    head_dim: 256
    max_position_embeddings: 8192
    rms_norm_eps: 1e-6
    rope_theta: 10000.0
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
