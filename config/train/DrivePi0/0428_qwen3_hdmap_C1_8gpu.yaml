defaults:
  - _self_
hydra:
  run:
    dir: ${log_dir}
_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/DrivePi_8GPU  # You need to set path
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_mogo_hdmap_C1_8gpu
log_dir: ${oc.env:LOG_DIR}/train/${name}/${run_name}

name: drive-pi0
device: cuda
n_nodes: 1
seed: 42
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct   # You need to set path
load_pretrained_weights: True

# 模式 3: 从已训练的 checkpoint 进行 LoRA 微调
# resume_checkpoint_path:
finetune_checkpoint_path:
resume_checkpoint_path:

train_vlm: False  # 必须为 True，LoRA 微调 VLM 模块
action_expert_adaptive_mode:  # adaLN, adaLN-Zero, or None
use_torch_compile: True
use_bf16: True
# 混合精度
use_amp: True
quantize: False

# ===== LoRA 配置 =====
lora: False
lora_r: 32
lora_alpha: 32
lora_dropout: 0.05
# --- 按组件启用 LoRA（每项可独立配置） ---
lora_vlm: False            # VLM language model attention (q/k/v/o_proj)
lora_vlm_mlp: False        # VLM language model MLP (gate/up/down_proj)
lora_vision: False         # Vision tower attention (qkv, proj)
lora_vision_mlp: False     # Vision tower MLP (linear_fc1/fc2)
lora_vision_merger: False  # Vision-text merger & deepstack merger
# 可选: 自定义 VLM attention 目标层
# lora_vlm_targets: [q_proj, k_proj, v_proj, o_proj]

# ============================================================
# HDMap 开关
# ============================================================
# 方案 A: HDMap BEV 图像作为额外视觉输入 (第 9 张图)
use_hdmap_image: False

# 方案 B: HDMap 标量特征 → proprio state
use_hdmap_proprio: False

# 方案 C1: 只改 HDMap 预处理
use_hdmap_cnn: True
hdmap_cnn_dim: 32
hdmap_bev_downsample_size: [96, 180]
hdmap_downsample_mode:
  lanes: max
  lane_links: max
  lane_boundaries: max
  junctions: area
hdmap_channel_scale: [0.08, 0.12, 0.10, 1.0]
hdmap_fusion_mode: concat
separate_hdmap_optimizer_group: False
hdmap_lr: 1e-4
hdmap_weight_decay: 1e-4
hdmap_lr_scheduler:
  min_lr: 1e-6

data:
  train:
    statistics_path: ${data.train.dynamic_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi_hdmap # 训练集不变
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13 # useless in drive-pi0
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}  # 引用顶层的 norm_mode
    use_his_trajectory: True
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}
  val:
    statistics_path: ${data.val.dynamic_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi_hdmap # 测试集不变
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13 # useless in drive-pi0
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}  # 引用顶层的 norm_mode
    use_his_trajectory: True
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}

swanlab:
  enable: True
  project: DriveMoE_Qwen3
  experiment_name: ${run_name}
  mode: cloud
  description: null
  entity: null

log_freq: 16
# 归一化方法: percentile_clip, percentile, minmax
norm_mode: minmax
# 轨迹类型加权采样：对转弯/静止样本过采样，缓解数据不平衡
trajectory_weighted_sampling:
  enable: True
  static_threshold: 1.0     # 末端位移 < 1m 判定为静止
  turn_threshold: 2.0       # 末端横向偏移 > 2m 判定为转弯
  static_weight: 2.0        # 静止样本采样权重
  turn_weight: 3.0          # 转弯样本采样权重
  straight_weight: 1.0      # 直行样本采样权重

# ===== 只需设置以下 3 个参数，其余自动计算 =====
n_epochs: 40
n_train: 59778
per_device_batch_size: 24
# ================================================

num_gpus: 8
global_batch_size: ${eval:'${per_device_batch_size} * ${num_gpus}'}
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}
save_model_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
eval_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 5'}
eval_size: 1024
eval_full_val: False
eval_seed: 42
eval_repeats: 1
eval_map_modes: [normal]
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
num_workers: 8
# 学习率 — LoRA 可用更高的 VLM 学习率
action_lr: 1e-5
vlm_lr: 1e-5
action_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 200
vlm_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 200
action_weight_decay: 0
vlm_weight_decay: 0
# 梯度裁剪
max_grad_norm: 1.0

flow_sampling: beta
num_inference_steps: 10
final_action_clip_value: 1.0  # data normalized in [-1,1]

# 轨迹辅助loss配置
trajectory_loss:
  lambda_smooth: 0.05
  lambda_accel: 0.02
  endpoint_weight_mode: linear
  endpoint_weight_max: 2.0

cond_steps: 5
horizon_steps: 6
action_dim: 2
proprio_dim: 9
state_dim: ${proprio_dim}
max_seq_len: 600
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 6144
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: False
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
time_hidden_size: 256

pad_token_id: 0

joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: "gelu_pytorch_tanh"
    max_position_embeddings: 262144
    rms_norm_eps: 1e-6
    rope_theta: 5000000
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    rope_scaling:
      mrope_interleaved: true
      mrope_section: [24, 20, 20]
      rope_type: "default"

image_token_index: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653
vocab_size: 151936
bos_token_id: 151643
eos_token_id: 151645
