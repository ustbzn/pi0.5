defaults:
  - _self_
hydra:
  run:
    dir: ${log_dir}
_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Drive_pi  # You need to set path
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_nuscene_0325
log_dir: ${oc.env:LOG_DIR}/train/${name}/${run_name}

name: drive-pi0
device: cuda
n_nodes: 1
seed: 42
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct   # You need to set path
load_pretrained_weights: True
resume_checkpoint_path: 
# resume_checkpoint_path: ${current_dir}/checkpoint
train_vlm: False
action_expert_adaptive_mode:  # adaLN, adaLN-Zero, or None
use_torch_compile: True
use_bf16: True
# use_fp16: False
# 混合精度
use_amp: True
quantize: False
lora: False
lora_r: 32
lora_dropout: 0.05

data:
  train:
    statistics_path: ${current_dir}/${data.train.dynamic_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: datasets/nuscene-0111 # 训练集不变
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13 # useless in drive-pi0
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}  # 引用顶层的 norm_mode
  val:
    statistics_path: ${current_dir}/${data.val.dynamic_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: datasets/nuscene-0111 # 测试集不变
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13 # useless in drive-pi0
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}  # 引用顶层的 norm_mode

swanlab:
  enable: True
  project: DriveMoE_Qwen3
  experiment_name: ${run_name}
  mode: cloud
  description: null
  entity: null

# wandb:
#   entity: null
#   project: drive-pi0
#   run: ${now:%H-%M-%S}_${name}

log_freq: 16
n_epochs: 40
# 归一化方法: percentile_clip, percentile, minmax
norm_mode: percentile
# 需要修改的参数
n_train: 23930  # total training samples; update when dataset size changes
# n_updates: 总更新次数 = ceil(训练样本数 / 实际全局batch大小) * epoch数
# 注意: 实际 global_batch_size 会在训练代码中自动计算 (448 = 4 GPUs * 16 per_device * 7 accumulation)
# 使用向上取整确保每个epoch至少有一次更新: ceil(480 / 448) * n_epochs = 2 * 15 = 30
# 或者可以设置更大的值，让模型训练更多步
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}  # 向上取整
# save_model_freq: 每多少个更新保存一次模型
# 设置为每个epoch保存一次: ceil(n_train / global_batch_size)
# 如果希望更频繁保存，可以减小这个值
save_model_freq: ${eval:'(${n_train} + ${global_batch_size} - 1) // ${global_batch_size}'}  # 向上取整，每个epoch保存一次
eval_freq: 1000
# eval_freq: ${eval:'${n_train} // ${global_batch_size} * 4'}
eval_size: 1024
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]

# 需要修改的参数
# 注意: 实际 global_batch_size = per_device_batch_size * grad_accumulation_steps * num_gpus
# 如果有4个GPU，每个设备16，建议设置为 64 的倍数 (4 * 16 = 64)
# 例如: 64, 128, 192, 256, 320, 384, 448, 512 等
global_batch_size: 1024  # 1 GPU * 16 per_device * 7 accumulation = 64
per_device_batch_size: 32 # 不训vlm时可以设置更大64，但训vlm时建议保持较小以适应显存如8
num_workers: 8
# 学习率
action_lr: 1e-5
vlm_lr: 1e-5
action_lr_scheduler:
  first_cycle_steps: 23930 # basically no decaying
  min_lr: 1e-8
  warmup_steps: 200 # a bit of warmup
vlm_lr_scheduler:
  first_cycle_steps: 23930
  min_lr: 1e-8
  warmup_steps: 200
action_weight_decay: 0
vlm_weight_decay: 0
# 梯度裁剪
max_grad_norm: 1.0

flow_sampling: beta
num_inference_steps: 10
final_action_clip_value: 1.0  # data normalized in [-1,1]

cond_steps: 5  # 必须与 window.sh 中的 --window_size 参数一致
horizon_steps: 7  # 必须与 window.sh 中的 --horizon 参数一致
action_dim: 2 # EEF_POS
proprio_dim: 10  # 实际维度: his_speed(1) + his_acceleration(3) + his_angular_velocity(3) + his_theta(1) + x_command_far(1) + y_command_far(1) = 10
state_dim: ${proprio_dim}
max_seq_len: 532  # fixed 512 for image + max 20 for text
tokenizer_padding: max_length # instead of truncating to longest
max_image_text_tokens: ${max_seq_len}

mixture:
  vlm:   # qwen3-vl
    hidden_size: 2048  # Qwen3-VL-2B 的 hidden_size
    intermediate_size: 6144  # Qwen3-VL-2B 的 intermediate_size（官方值）
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:  # not applicable for qwen3-vl
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
time_hidden_size: 256 # only applicable if using adaptive

# Fixed
pad_token_id: 0

