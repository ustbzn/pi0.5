# ============================================================================
# Phase 2: Action Expert + Image Expert 双 MOE 配置 (0522, 基于 0521 Phase 1)
# ============================================================================
# 配置说明:
#   - 在 0521 Phase 1 (仅 Action Expert MoE) 的基础上同时启用 Image Expert MoE,
#     替换 VLM 侧偶数中段层 (14-26) 的 Qwen3VLTextMLP 为 SharedExpertMoEMLP。
#   - 设计与代码对齐说明详见 docs/moe_design_v2_适配方案.md (Phase 2 部分)。
#   - 实现位置:
#       src/model/DrivePi0/moe_mlp.py        — SharedExpertMoEMLP (action / image 共用)
#       src/model/DrivePi0/qwen3mixture.py   — VLMMixtureAdapter 内 MLP 替换 + shared 拷贝
#       src/model/DrivePi0/joint_model.py    — moe_config 透传给 VLMMixtureAdapter
#       src/model/DrivePi0/drivepi0.py       — VLM-only shared expert 参数分组、aux_loss 收集
#       src/agent/drivepi0/train.py          — image MoE 的 finetune key 重映射
#                                              + DDP find_unused_parameters 自动开启
#
# 与 0521 Phase 1 的关键差异:
#   - moe.image_expert.enable: False → True   启用 VLM 偶数中段层的 MLP MoE
#   - moe.image_expert.apply_to_layers: even_mid  仅替换 14-26 偶数层 (共 7 层)
#   - moe.freeze_vlm_shared_expert: True       保护 0514 baseline 的 VLM MLP 权重
#   - per_device_batch_size: 6 → 4             routed expert 新增 ~0.79B 参数, 显存预留
#   - n_epochs: 20 → 10                        Phase 2 是 Phase 1 之后的渐进升级训练
#   - finetune_checkpoint_path: 指向 Phase 1 的最终 ckpt (action MoE 已收敛)
#   - run_name 后缀加 _phase2 标记本阶段
#
# 三种加载模式:
#   1. 推荐路径 (本配置默认): finetune_checkpoint_path 指向 Phase 1 末态 ckpt
#      - action 侧 MoE: shared/routed/gate 完整恢复 (Phase 1 已学好)
#      - image 侧 MoE: 由 _load_model_weights_only 自动重映射 mlp.<x> → mlp.shared_expert.<x>
#                       routed_expert 由 init_routed_experts_from_shared 从 shared 拷贝
#                       (down_proj 置零, gate_proj/up_proj 加 1e-3 噪声破对称)
#                       第 0 步 image_routed(x) ≡ 0 → 严格保留 Phase 1 行为
#   2. 跳过 Phase 1 直接同时启用 (备选): finetune_checkpoint_path 改成 0514 baseline
#      - action / image MoE shared_expert 都从 0514 重映射加载;routed_expert 从 shared 拷贝
#      - 不推荐: 同时引入两组新参数, 训练稳定性下降, 相当于一次性变化太大
#   3. 断点续训 (resume_checkpoint_path=/path/to/phase2_ckpt.pt): 完整恢复全部 MoE 状态,
#      不再经过 init_routed_experts_from_shared (gate.weight 非零会自动跳过)。
# ============================================================================

defaults:
  - _self_

hydra:
  run:
    dir: ${log_dir}

_target_: src.agent.drivepi0.train.DrivePiZeroTrainAgent

# ==================== 路径配置 ====================
current_dir: /pcpt/pcpt/project/jiangjunyuan/code/VLA/DrivePi_8GPU
dataset_dir: /pcpt/pcpt/data/VLA/MOGO/mogo_dataset_navi_hdmap
pretrained_model_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/Qwen3-VL-2B-Instruct
run_name: ${now:%Y-%m-%d}_${now:%H-%M}_qwen3_hdmap_image_moe_phase2_8gpu
log_dir: ${oc.env:LOG_DIR,logs}/train/${name}/${run_name}

# ==================== 基本设置 ====================
name: drive-pi0
device: cuda
n_nodes: 1
seed: 42

# ==================== 模型加载 ====================
# Phase 2 推荐: 从 Phase 1 末态 finetune. 请将下方路径替换为本环境实际产出的 Phase 1 ckpt:
#   logs/train/drive-pi0/<phase1_run_name>/checkpoint/step<final>.pt
# 若 Phase 1 尚未跑完, 可临时切回 0514 baseline (并在第一次 step 检查 loss 不发散):
#   ${current_dir}/logs/train/drive-pi0/2026-05-14_20-56_qwen3_hdmap_all_features_8gpu/checkpoint/step37400.pt
load_pretrained_weights: True
resume_checkpoint_path:
finetune_checkpoint_path: /pcpt/pcpt/project/jiangjunyuan/code/VLA/DrivePi_8GPU/logs/train/drive-pi0/2026-05-21_16-57_qwen3_hdmap_action_moe_phase1_v2_8gpu/checkpoint/step24920.pt

# ==================== 训练模式 ====================
# Phase 2 必须 train_vlm=True; 否则 freeze_vlm_weights() 会把 VLM 整个 mixture
# (含 shared / routed / gate) 全部冻结, image MoE 等于没启用。
train_vlm: True
state_only_for_action: False
mask_vlm_for_action: False
action_expert_adaptive_mode:        # adaLN / adaLN-Zero / null
use_torch_compile: False            # MoE 稀疏 dispatch + dummy forward 控制流复杂, 关闭 compile
use_bf16: True
use_fp16: False
use_amp: True
quantize: False
use_lm_head: False

# ==================== LoRA 配置 ====================
# 与 Phase 1 一致, 全部关闭. 注意:
#   inject_lora 中 hasattr(layer.mlp, "gate_proj") 在 SharedExpertMoEMLP 上返回 False
#   (实际属性挂在 mlp.shared_expert.gate_proj 下), 因此 lora_vlm_mlp=True 会静默
#   跳过 MoE 层的 MLP. Phase 2 不建议混用 lora_vlm_mlp; lora_vlm (attention) 不受影响。
lora: False
lora_r: 32
lora_alpha: 32
lora_dropout: 0.05
lora_vlm: False
lora_vlm_target_modules: [q_proj, k_proj, v_proj, o_proj]
lora_vlm_mlp: False
lora_vision: False
lora_vision_mlp: False
lora_vision_merger: False
lora_vision_deepstack_merger: False

# ==================== HDMap 开关 (A/B/C1-C3) ====================
use_hdmap_image: True
hdmap_image_size: [352, 192]
use_hdmap_proprio: False
use_hdmap_cnn: False
hdmap_cnn_dim: 32
hdmap_bev_downsample_size: [96, 180]
hdmap_downsample_mode:
  lanes: max
  lane_links: max
  lane_boundaries: max
  junctions: area
hdmap_channel_scale: [0.08, 0.12, 0.10, 1.0]
hdmap_fusion_mode: gated_residual

separate_hdmap_optimizer_group: False
hdmap_lr: 1e-4
hdmap_weight_decay: 1e-4
hdmap_lr_scheduler:
  min_lr: 1e-6

# ==================== 数据集 ====================
data:
  train:
    statistics_path: ${dataset_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: ${dataset_dir}
    fixed_dir: b2d_fixed_camera
    split: train
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: False
    use_his_trajectory: True
    state_frame_index:
    cam_image_size: ${cam_image_size}
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_image_size: ${hdmap_image_size}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}
  val:
    statistics_path: ${dataset_dir}/statistics.json
    use_fixed_images: False
    work_dir: ${current_dir}
    dynamic_dir: ${dataset_dir}
    fixed_dir: b2d_fixed_camera
    split: val
    num_of_action_experts: 13
    shuffle_buffer_size: 200000
    norm_mode: ${norm_mode}
    nav_onehot: False
    use_his_trajectory: True
    state_frame_index:
    cam_image_size: ${cam_image_size}
    use_hdmap_image: ${use_hdmap_image}
    use_hdmap_proprio: ${use_hdmap_proprio}
    use_hdmap_cnn: ${use_hdmap_cnn}
    hdmap_image_size: ${hdmap_image_size}
    hdmap_bev_downsample_size: ${hdmap_bev_downsample_size}
    hdmap_downsample_mode: ${hdmap_downsample_mode}
    hdmap_channel_scale: ${hdmap_channel_scale}

cam_image_size: [224, 224]
norm_mode: minmax

# ==================== 日志 ====================
swanlab:
  enable: False
  project: DriveMoE_Qwen3
  experiment_name: ${run_name}
  mode: cloud
  description: "Qwen3-VL + HDMap A + Action MoE Phase1 + Image MoE Phase2 (1 shared + 3 routed top-1)"
  entity: null

log_freq: 16

# ==================== 加权采样 (方案 D) ====================
nav_weighted_sampling: False
trajectory_weighted_sampling:
  enable: True
  static_threshold: 1.0
  turn_threshold: 2.0
  static_weight: 2.0
  turn_weight: 3.0
  straight_weight: 1.0
  hard_case_weight_path: null
  hard_case_alpha: 1.0

# ==================== 训练超参数 ====================
# Phase 2 在 Phase 1 上做渐进升级, n_epochs 减半至 10。
# per_device_batch_size 从 6 降到 4, 给 image MoE 7 层 × 3 routed × ~37.7M ≈ 0.79B
# 新增显存留出空间; A100-80GB 实测 4 应能跑通, 若 OOM 再降到 3。
n_epochs: 10
n_train: 59778
num_gpus: 8
per_device_batch_size: 6
global_batch_size: ${eval:'${per_device_batch_size} * ${num_gpus}'}
n_updates: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * ${n_epochs}'}
save_model_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 2'}
num_workers: 8
max_grad_norm: 1.0

# ==================== Eval 配置 ====================
eval_freq: ${eval:'((${n_train} + ${global_batch_size} - 1) // ${global_batch_size}) * 2'}
eval_size: 1024
eval_full_val: True
eval_seed: 42
eval_repeats: 1
eval_map_modes: [normal]
eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]

# ==================== 学习率 ====================
# - action_lr / vlm_lr 与 Phase 1 / 0514 baseline 一致;
# - moe.router_lr / moe.routed_expert_lr 见下方 moe 段。
# 注意: image MoE 的 routed_expert 虽然挂在 VLM 侧, 但作为新参数走 moe_optimizer
# 用 routed_expert_lr (= action_lr=5e-5) 训练, 而不是 vlm_lr=5e-6;
# 这是设计选择: 新引入的 routed expert 需要更高 lr 才能从 (shared + 噪声) 出发
# 学到 specialization, 5e-6 太慢。
action_lr: 5e-5
vlm_lr: 5e-6
action_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 200
vlm_lr_scheduler:
  first_cycle_steps: ${n_updates}
  min_lr: 1e-8
  warmup_steps: 500
action_weight_decay: 0
vlm_weight_decay: 0

# ==================== Flow Matching ====================
flow_sampling: beta
flow_alpha: 1.5
flow_beta: 1.0
flow_sig_min: 0.001
num_inference_steps: 10
final_action_clip_value: 1.0

# ==================== 轨迹辅助损失 ====================
trajectory_loss:
  lambda_smooth: 0.05
  lambda_accel: 0.02
  endpoint_weight_mode: linear
  endpoint_weight_max: 2.0

# ==================== Action-grounded 辅助监督 (方案 A) ====================
aux_loss:
  enable: False
  lambda_maneuver: 0.2
  lambda_stop: 0.1
  lambda_endpoint: 0.2
  lambda_progress: 0.05
  lambda_curvature: 0.05

# ==================== 序列维度 ====================
cond_steps: 5
horizon_steps: 6
action_dim: 2
proprio_dim: 9
state_dim: ${proprio_dim}

max_seq_len: 700
tokenizer_padding: max_length
max_image_text_tokens: ${max_seq_len}

# ==================== Mixture 配置 ====================
mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 6144
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
  proprio:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: True
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}

time_hidden_size: 256

# ==================== Joint Model (Transformer) ====================
joint:
  _target_: src.model.DrivePi0.joint_model.JointModel
  config:
    pretrained_model_path: ${pretrained_model_path}
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    mixture: ${mixture}
    lora:
      r: ${lora_r}
      dropout: ${lora_dropout}
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: "silu"
    max_position_embeddings: 262144
    rms_norm_eps: 1e-6
    rope_theta: 5000000
    attention_bias: False
    attention_dropout: 0.0
    pad_token_id: ${pad_token_id}
    rope_scaling:
      mrope_interleaved: true
      mrope_section: [24, 20, 20]
      rope_type: "default"

# ==================== Qwen3-VL Token 配置 ====================
pad_token_id: 0
image_token_index: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653
vocab_size: 151936
bos_token_id: 151643
eos_token_id: 151645

# ============================================================================
# MOE v2: Shared Expert + Routed Expert (Phase 2 同时启用 Action + Image MoE)
# ============================================================================
#
# 关键决策:
#   1. action_expert.enable = True:    继承 Phase 1 配置, 训练时 routed/router 完整加载
#   2. image_expert.enable  = True:    新启用; 替换 VLM 第 14/16/18/20/22/24/26 共 7 层 MLP
#   3. freeze_shared_expert = True:    保护 Phase 1 学好的 action MLP 权重
#   4. freeze_vlm_shared_expert = True: 保护 0514 baseline 的 VLM MLP 权重 (核心要点)
#      - 让 image_routed_expert 在原 Qwen3 MLP 周围学习驾驶场景的 specialization,
#        而不是在 routed expert 训练初期把 shared expert 的预训练知识冲掉。
#      - 若想做 "shared + routed 联合 finetune", 改为 False, shared 跟随 vlm_optimizer
#        用 vlm_lr (5e-6) 训练。
#   5. routed_init_noise_std = 1e-3:   down_proj 已被代码强制置零, noise 仅用于打破
#      N=3 个 routed expert 间的对称性。Qwen3VLTextMLP 线性层 std ≈ 0.02-0.03,
#      1e-3 是 ~3% 相对扰动, 足够破对称。
#   6. aux_loss_coeff = 1.0:           与每个 SharedExpertMoEMLP 内 load_balance_coeff
#      串联。Phase 2 共 14 (action) + 7 (image) = 21 个 MoE 层贡献 aux_loss,
#      总量级 = 21 × 0.01 × N_e × sum(f·P) ~ O(0.06-0.21), 与 flow matching loss
#      (~1e-2 → 1e-1) 同数量级, 不需要额外缩放。
#   7. router_lr = 1e-4:               稍高于 action_lr (5e-5), 让 router 优先收敛到
#      合理分配; routed_expert_lr 默认与 action_lr 一致, action / image 共享 lr 调度。
#   8. apply_to_layers = even_mid:     仅替换 14-26 偶数层共 7 层。
#      - 避开底层 (0-12) 视觉细节: 防止 routed expert 在低层就发散开;
#      - 避开高层最后一层 (27): _check_qwen_unused_parameter_by_name 会冻结 27.mlp,
#        若 apply_to_layers=all 会让 27.mlp.routed/shared 全部 requires_grad=False;
#      - even_mid 命中 14/16/18/20/22/24/26 共 7 层, 显存增量 ≈ 0.79B 可控。
# ============================================================================
moe:
  # ── 总开关 ─────────────────────────────────────────────────────────────────
  aux_loss_coeff: 1.0               # forward 累加 aux_loss 时的总倍率
  freeze_shared_expert: True        # action MoE 的 shared (= Phase 1 已训权重) 是否冻结
  freeze_vlm_shared_expert: True    # image MoE 的 shared (= 0514 baseline VLM MLP) 是否冻结
  routed_init_noise_std: 1e-3       # 仅作用于 routed expert 的 gate_proj/up_proj;
                                    # down_proj 由代码侧强制置零, 不受此值影响

  # ── 学习率 (router / routed_expert 通用; action 与 image 共享 moe_optimizer) ──
  router_lr: 1e-4
  routed_expert_lr: ${action_lr}
  router_weight_decay: 0.0
  routed_expert_weight_decay: ${action_weight_decay}
  lr_scheduler:
    router_min_lr: 1e-6
    routed_expert_min_lr: ${action_lr_scheduler.min_lr}

  # ── Action Expert MOE (Phase 1 已启用, Phase 2 继续启用) ──────────────────
  action_expert:
    enable: True
    num_routed_experts: 3           # 决策空间 C(3,1)=3, 负载均衡容易
    top_k: 1                        # 每 token 激活 1 个 routed + 1 个 shared = 2 个 expert
    load_balance_coeff: 0.01        # 单层负载均衡 loss 系数

  # ── Image Expert MOE (Phase 2 新启用) ─────────────────────────────────────
  image_expert:
    enable: True
    num_routed_experts: 3           # 与 action_expert 对齐, 后续可单独调
    top_k: 1                        # 与 action_expert 对齐 (top-1 路由 + shared)
    apply_to_layers: even_mid       # even / even_mid (14-26) / all
    load_balance_coeff: 0.01
